<svg viewBox="-80 -50 460 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53935" />
    </marker>
  </defs>

  <!-- Floor -->
  <line x1="20" y1="140" x2="280" y2="140" stroke="currentColor" stroke-width="2" />
  
  <!-- Block -->
  <rect x="120" y="80" width="80" height="60" fill="none" stroke="currentColor" stroke-width="2" />
  <text x="160" y="117" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-size="20">12 kg</text>
  
  <!-- Text above block -->
  <text x="160" y="65" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-size="16">V<tspan dy="5" font-size="12">o</tspan><tspan dy="-5"> = 0</tspan></text>
  
  <!-- Force Vector -->
  <line x1="40" y1="110" x2="100" y2="110" stroke="#E53935" stroke-width="2" marker-end="url(#arrow)" />
  <text x="70" y="95" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-size="18">80 N</text>
</svg>
