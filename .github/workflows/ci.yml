name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Typecheck Shared Package
      run: npm run typecheck --workspace=packages/shared
      
    - name: Run Vitest
      run: npm run test:run --workspace=apps/web

    - name: Build Web App
      run: npm run build --workspace=apps/web

    - name: Build Cloud Functions
      run: npm run build --workspace=apps/functions
