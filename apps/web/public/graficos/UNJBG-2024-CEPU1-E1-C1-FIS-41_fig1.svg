<svg viewBox="0 160 740 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="-1" y1="9" x2="9" y2="-1" stroke="currentColor" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polyline points="9,1 1,5 9,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polyline points="1,1 9,5 1,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-ray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 L 3 5 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Eje principal -->
  <line x1="100" y1="500" x2="640" y2="500" stroke="currentColor" stroke-width="2"/>

  <!-- Espejo y línea tangente -->
  <line x1="640" y1="320" x2="640" y2="680" stroke="currentColor" stroke-width="2"/>
  <path d="M 571.246 320 Q 710 500 571.246 680" fill="none" stroke="currentColor" stroke-width="3"/>

  <!-- Puntos C y F -->
  <circle cx="370" cy="500" r="4" fill="currentColor"/>
  <text x="370" y="530" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="bold" fill="currentColor">C</text>
  <circle cx="505" cy="500" r="4" fill="currentColor"/>
  <text x="505" y="530" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="bold" fill="currentColor">F</text>

  <!-- Objeto e imagen -->
  <rect x="460" y="440" width="20" height="60" fill="url(#hatch)" stroke="currentColor" stroke-width="2"/>
  <rect x="100" y="500" width="20" height="180" fill="url(#hatch)" stroke="currentColor" stroke-width="2"/>
  <text x="110" y="710" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="bold" fill="currentColor">I</text>

  <!-- Rayos de luz -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <polyline points="480,440 556.624,440 633.248,440" marker-mid="url(#arrow-ray)"/>
    <polyline points="633.248,440 376.624,560 120,680" marker-mid="url(#arrow-ray)"/>
    <polyline points="480,440 525.623,560 571.246,680" marker-mid="url(#arrow-ray)"/>
    <polyline points="571.246,680 335.623,680 100,680" marker-mid="url(#arrow-ray)"/>
  </g>

  <!-- Líneas de proyección -->
  <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="100" y1="320" x2="100" y2="500" />
    <line x1="460" y1="320" x2="460" y2="500" />
  </g>

  <!-- Cotas y etiquetas -->
  <g fill="currentColor">
    <line x1="100" y1="320" x2="460" y2="320" stroke="currentColor" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="280" y="290" text-anchor="middle" font-size="28" font-family="sans-serif">36 cm</text>
    <line x1="460" y1="410" x2="640" y2="410" stroke="currentColor" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <text x="550" y="380" text-anchor="middle" font-size="28" font-family="sans-serif" font-style="italic">&#952;</text>
  </g>
</svg>
